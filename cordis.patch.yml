# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      config:
        enabled: true
        # DSHA 上这两项都会被宿主判定短路：autoApply 在改写任何文件前返回
        # skip:dsha_manual_apply_required，autoUpdateIfNeeded 返回
        # skipped:host_managed。因此无论开关取何值，DSHA 的启动路径都不会
        # 自行改写 loader 树 —— 安全性不依赖开关，不要为了「保护 DSHA」而
        # 关掉它们（那只会让 Web / 桌面端失去自动应用，属功能回退）。
        # 判定依据是宿主注入的 DSHA_APP=1（旧版 DSHA 由 DSHA_* 旁证兜底），
        # 不能改成依赖插件自行猜测环境。
        autoApplyOnStart: true
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: true
        continueMax: 3
        continueText: "继续"

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
